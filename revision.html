<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Exam Revision Notes & Formula Sheets">
  <title>Revision Notes — Lakshya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20261115-dark-colors">
</head>
<body data-page-title="Revision Materials">

  <!-- Top Navigation -->
  <header class="topbar" role="banner">
    <a href="index.html" class="topbar-brand" aria-label="Home">
      <span data-site-name>Lakshya</span>
    </a>
    <div class="topbar-actions">
      <a href="index.html" class="btn btn-outline" style="font-size:0.85rem; padding:6px 12px; margin-right:8px; text-decoration:none;">📝 Practice Tests</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark/light mode">🌙</button>
    </div>
  </header>

  <!-- Container -->
  <div class="container" style="max-width: 1280px; margin: 0 auto; padding: 20px;">
    
    <!-- Hero Header -->
    <section class="home-hero" style="text-align: left; padding: 24px 0 12px 0;">
      <h1 style="font-size: 2rem; margin-bottom: 8px;">📖 General Awareness Command Center</h1>
      <p class="revision-intro">
        High-density revision for India GK, defence, intelligence, UP, Gorakhpur, technology, security, geopolitics, and current affairs.
      </p>
    </section>

    <!-- Main Revision Layout -->
    <div class="revision-layout">
      <!-- Left Sidebar: Modules & Search -->
      <aside class="revision-sidebar" aria-label="Revision Topics">
        <div class="filter-group">
          <label class="filter-label" for="filter-category">Category</label>
          <select id="filter-category" class="filter-select">
            <option value="All">All</option>
            <option value="India">India</option>
            <option value="Defence">Defence</option>
            <option value="Army">Army</option>
            <option value="Navy">Navy</option>
            <option value="Air Force">Air Force</option>
            <option value="Special Forces">Special Forces</option>
            <option value="Intelligence">Intelligence</option>
            <option value="Police">Police</option>
            <option value="CAPF">CAPF</option>
            <option value="UP">UP</option>
            <option value="Gorakhpur">Gorakhpur</option>
            <option value="Technology">Technology</option>
            <option value="Cyber">Cyber</option>
            <option value="Space">Space</option>
            <option value="Nuclear">Nuclear</option>
            <option value="IR">IR</option>
            <option value="Neighbours">Neighbours</option>
            <option value="Wars">Wars</option>
            <option value="Global Hotspots">Global Hotspots</option>
            <option value="Current Affairs">Current Affairs</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-exam">Exam</label>
          <select id="filter-exam" class="filter-select">
            <option value="All">All</option>
            <option value="CDS">CDS</option>
            <option value="AFCAT">AFCAT</option>
            <option value="CAPF">CAPF</option>
            <option value="SSB">SSB</option>
            <option value="UP SI">UP SI</option>
            <option value="IBPS">IBPS</option>
            <option value="SBI SO">SBI SO</option>
            <option value="General Government Exams">General Government Exams</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-depth">Depth</label>
          <select id="filter-depth" class="filter-select">
            <option value="All">All</option>
            <option value="Quick">Quick</option>
            <option value="Standard">Standard</option>
            <option value="Deep">Deep</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-time">Time</label>
          <select id="filter-time" class="filter-select">
            <option value="All">All</option>
            <option value="10 sec">10 sec</option>
            <option value="1 min">1 min</option>
            <option value="5 min">5 min</option>
            <option value="Deep Revision">Deep Revision</option>
          </select>
        </div>

        <div class="filter-actions">
          <button id="clear-filters" class="btn btn-outline" type="button">Clear Filters</button>
        </div>

        <input type="text" id="revision-search" class="revision-search" placeholder="🔍 Search topics or formulas..." autocomplete="off">
        <div id="sidebar-categories">
          <!-- Populated by js/revision.js -->
          <div style="text-align:center; padding: 20px; color: var(--text-muted);">Loading topics…</div>
        </div>
      </aside>

      <!-- Right Main Content: Rendered Module -->
      <main class="revision-content" id="revision-main" role="main" aria-live="polite">
        <div id="content-container">
          <!-- Populated by js/revision.js -->
        </div>
      </main>
    </div>

  </div>

  <footer class="page-footer" data-site-footer style="margin-top: 40px; text-align: center; padding: 20px; font-size: 0.85rem; color: var(--text-muted);">
    Lakshya Exam Platform • Revision Encyclopedia
  </footer>

  <script src="js/app.js?v=20261106-reset"></script>
  <script src="js/revision.js?v=20261115-dark-colors"></script>
</body>
</html>
